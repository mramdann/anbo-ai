<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Anbo Browser Automation Test Fixture</title>
  <style>
    body { font-family: sans-serif; margin: 24px; line-height: 1.5; }
    .section { margin-bottom: 20px; padding: 12px; border: 1px solid #ccc; border-radius: 6px; }
    .scroll-box { height: 800px; background: linear-gradient(to bottom, #f0f0f0, #e0e0e0); margin-top: 10px; padding: 10px; }
  </style>
</head>
<body>
  <h1>Anbo Automation Test Fixture</h1>

  <div class="section">
    <h2>Buttons & Actions</h2>
    <button id="btn-count" onclick="document.getElementById('click-status').innerText = 'Clicked ' + (++count) + ' times';">Click Me</button>
    <span id="click-status">Not clicked</span>
  </div>

  <div class="section">
    <h2>Text Inputs</h2>
    <label for="input-text">Text Input:</label>
    <input type="text" id="input-text" placeholder="Type here..." />
    <br><br>
    <label for="input-password">Password Input:</label>
    <input type="password" id="input-password" value="secret123" />
  </div>

  <div class="section">
    <h2>Selection & Checkboxes</h2>
    <label><input type="checkbox" id="chk-test" /> Checkbox</label>
    <br><br>
    <select id="sel-option">
      <option value="opt1">Option 1</option>
      <option value="opt2">Option 2</option>
    </select>
  </div>

  <div class="section">
    <h2>Delayed Content</h2>
    <button onclick="setTimeout(() => { document.getElementById('delay-box').innerText = 'Completed'; }, 1000);">Start Delayed Process</button>
    <div id="delay-box" style="margin-top:8px; font-weight:bold;">Waiting...</div>
  </div>

  <div class="section">
    <h2>Navigation Link</h2>
    <a href="https://example.com" id="link-nav">Go to Example.com</a>
  </div>

  <div class="section scroll-box">
    <h3>Scrollable Region</h3>
    <p>Scroll down to reach the bottom text.</p>
    <div style="margin-top: 600px;" id="bottom-marker">Bottom of page reached</div>
  </div>

  <script>
    let count = 0;
  </script>
</body>
</html>

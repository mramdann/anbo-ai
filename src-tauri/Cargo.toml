[package]
name = "anbo"
default-run = "anbo"
autobins = false
version = "0.14.4"
description = "anbo — multi-agent AI control workspace (based on Anbo)"
authors = ["crynta"]
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "anbo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
dirs = "6"
log = "0.4"
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
globset = "0.4"
getrandom = "0.4"
nucleo-matcher = "0.3"
shared_child = "1"
tauri-plugin-log = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
reqwest = { version = "0.12", default-features = false, features = [
	"rustls-tls",
	"stream",
] }
bytes = "1"
# Local MCP (Streamable HTTP) server. hyper/hyper-util/http-body-util are already
# compiled transitively via reqwest, so these direct deps add ~no build cost.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio"] }
http-body-util = "0.1"
base64 = "0.23"
futures-util = "0.3"
tokio = { version = "1", default-features = false, features = [
	"io-std",
	"io-util",
	"macros",
	"net",
	"rt",
	"rt-multi-thread",
	"sync",
	"time",
] }
tempfile = "3"
notify = "8.2.0"
which = "8.0.4"
url = "2"

[[bin]]
name = "anbo"
path = "src/main.rs"

[[bin]]
name = "anbo-browser"
path = "src/bin/anbo-browser.rs"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = [
	"apple-native",
] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSUserDefaults"] }

# WebKitGTK can't read external clipboard copies; mac/win webviews can.
[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-clipboard-manager = "2"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = [
	"windows-native",
] }
windows-sys = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_System_Console",
	"Win32_System_JobObjects",
	"Win32_System_ProcessStatus",
	"Win32_System_Threading",
	"Win32_System_Diagnostics_ToolHelp",
] }
webview2-com = "0.38"
windows = { version = "0.61", features = [
	"Win32_System_Com",
	"Win32_System_Com_StructuredStorage",
	"Win32_UI_WindowsAndMessaging",
	"Win32_Graphics_Gdi",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

[profile.dev]
incremental = true
# Full debug info (default) membuat artifact dev raksasa → link gagal di disk sempit
# (mesin dev C: 64GB penuh). line-tables-only: cukup utk panic backtrace, jauh lebih kecil.
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = true

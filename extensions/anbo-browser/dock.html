<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="light dark">
    <title>Anbo Dock</title>
    <style>
      html { height: 100%; background: oklch(1 0 0); color: oklch(0.52 0.021 213.5); }
      @media (prefers-color-scheme: dark) { html { background: oklch(0.148 0.004 228.8); color: oklch(0.723 0.014 214.4); } }
      body { display: grid; place-content: center; justify-items: center; gap: 14px; height: 100%; margin: 0; font: 13px/1.5 system-ui, "Segoe UI", sans-serif; text-align: center; }
      p { margin: 0; }
    </style>
    <script src="dock-page.js" defer></script>
  </head>
  <body>
    <img src="icon-48.png" srcset="icon-48.png 1x, icon-128.png 2x" alt="" width="48" height="48">
    <p>Preparing the selected tab for Anbo.<br>This window contains no login data.</p>
  </body>
</html>

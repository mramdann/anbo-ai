<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Anbo Browser Bridge</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header>
      <img src="icon-32.png" srcset="icon-32.png 1x, icon-48.png 1.5x, icon-128.png 2x" alt="" width="32" height="32">
      <div class="title">
        <h1>Anbo Browser Bridge</h1>
        <p id="subtitle">Use this browser profile in Anbo</p>
      </div>
      <span class="badge">Preview</span>
    </header>
    <main>
      <section id="state" class="state" data-tone="idle">
        <span class="dot" aria-hidden="true"></span>
        <div role="status">
          <p id="headline">Checking connection</p>
          <p id="detail"></p>
        </div>
        <button id="refresh" class="icon" type="button" title="Refresh status" aria-label="Refresh status">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
      </section>
      <form id="form" hidden>
        <div id="setup" class="field">
          <label for="profile">Name in Anbo <span>Optional</span></label>
          <input id="profile" maxlength="64" placeholder="Leave empty to use this profile's name" autocomplete="off" spellcheck="false">
        </div>
        <div class="actions">
          <button id="connect" class="primary" type="submit">Connect profile</button>
          <button id="disconnect" class="secondary" type="button" hidden>Disconnect</button>
        </div>
      </form>
    </main>
    <footer>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
      <p>Only tabs you open or choose in Anbo are connected. Connecting copies no passwords or cookies.</p>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>

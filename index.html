<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anbo</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("anbo-ui-theme-shadow");
          var resolved =
            t === "light" || t === "dark"
              ? t
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.classList.add(resolved);
          document.documentElement.style.backgroundColor =
            resolved === "dark" ? "#0a0a0a" : "#ffffff";
        } catch (e) {}
      })();
    </script>
    <style>
      #anbo-startup {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: #f5f5f5;
        background:
          radial-gradient(circle at 50% 38%, rgba(78, 121, 255, 0.12), transparent 34%),
          #0a0a0a;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      .light #anbo-startup {
        color: #171717;
        background:
          radial-gradient(circle at 50% 38%, rgba(78, 121, 255, 0.1), transparent 34%),
          #ffffff;
      }
      #anbo-startup-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        transform: translateY(-2vh);
      }
      #anbo-startup-mark {
        display: grid;
        width: 46px;
        height: 46px;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 15px;
        background: rgba(255, 255, 255, 0.045);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.22);
        font-size: 14px;
        font-weight: 700;
        letter-spacing: -0.04em;
      }
      .light #anbo-startup-mark {
        border-color: rgba(0, 0, 0, 0.1);
        background: rgba(0, 0, 0, 0.025);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.08);
      }
      #anbo-startup-title {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      #anbo-startup-status {
        margin: -8px 0 0;
        color: #737373;
        font-size: 10px;
      }
      #anbo-startup-track {
        width: 112px;
        height: 2px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(127, 127, 127, 0.18);
      }
      #anbo-startup-progress {
        width: 45%;
        height: 100%;
        border-radius: inherit;
        background: #6387ff;
        animation: anbo-startup-slide 1.15s ease-in-out infinite;
      }
      @keyframes anbo-startup-slide {
        0% { transform: translateX(-120%); }
        50% { transform: translateX(120%); }
        100% { transform: translateX(340%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #anbo-startup-progress { animation: none; transform: translateX(62%); }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="anbo-startup" role="status" aria-label="Starting Anbo">
        <div id="anbo-startup-card">
          <div id="anbo-startup-mark" aria-hidden="true">A</div>
          <p id="anbo-startup-title">Anbo</p>
          <p id="anbo-startup-status">Preparing your workspace</p>
          <div id="anbo-startup-track" aria-hidden="true">
            <div id="anbo-startup-progress"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

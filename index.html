<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anbo</title>
    <script data-anbo-startup-theme>
      (function () {
        var t = "system";
        var themeId = "anbo-default";
        var raw = null;
        try {
          t = localStorage.getItem("anbo-ui-theme-shadow");
          themeId = localStorage.getItem("anbo-ui-theme-id-shadow") || themeId;
          raw = localStorage.getItem("anbo-startup-theme-shadow");
        } catch (e) {}
        var resolved =
          t === "light" || t === "dark"
            ? t
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        var root = document.documentElement;
        root.classList.add(resolved);
        root.style.colorScheme = resolved;
        root.style.backgroundColor = "var(--startup-bg)";
        try {
          if (!raw || raw.length > 4096) return;
          var snapshot = JSON.parse(raw);
          if (!snapshot || snapshot.version !== 1 || snapshot.themeId !== themeId) return;
          var palette = snapshot[resolved];
          if (!palette || typeof palette !== "object" || Array.isArray(palette)) return;
          var keys = {
            background: "bg", foreground: "fg", mutedForeground: "muted",
            primary: "accent", border: "line", accent: "hover", destructive: "danger"
          };
          Object.keys(keys).forEach(function (key) {
            var value = palette[key];
            if (typeof value !== "string" || value.length > 128 ||
                /var\s*\(|url\s*\(|currentcolor|inherit|initial|unset|revert/i.test(value) ||
                !CSS.supports("color", value)) return;
            root.style.setProperty("--startup-" + keys[key], value);
          });
        } catch (e) {}
      })();
    </script>
    <style>
      @font-face {
        font-family: "Anbo Startup";
        src: url("/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2") format("woff2");
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
      }
      :root {
        --startup-bg: oklch(0.148 0.004 228.8);
        --startup-fg: oklch(0.987 0.002 197.1);
        --startup-muted: oklch(0.723 0.014 214.4);
        --startup-accent: oklch(0.925 0.005 214.3);
        --startup-line: oklch(1 0 0 / 10%);
        --startup-hover: oklch(0.275 0.011 216.9);
        --startup-danger: oklch(0.704 0.191 22.216);
      }
      :root.light {
        --startup-bg: oklch(1 0 0);
        --startup-fg: oklch(0.148 0.004 228.8);
        --startup-muted: oklch(0.56 0.021 213.5);
        --startup-accent: oklch(0.218 0.008 223.9);
        --startup-line: oklch(0.925 0.005 214.3);
        --startup-hover: oklch(0.963 0.002 197.1);
        --startup-danger: oklch(0.577 0.245 27.325);
      }
      #anbo-startup {
        --startup-gutter: clamp(32px, 12vw, 112px);
        position: fixed;
        inset: 0;
        display: grid;
        grid-template-rows: minmax(0, 1fr);
        box-sizing: border-box;
        overflow-x: hidden;
        overflow-y: auto;
        padding: clamp(52px, 10vh, 80px) var(--startup-gutter) 94px;
        color-scheme: inherit;
        color: var(--startup-fg);
        background: var(--startup-bg);
        font-family: "Anbo Startup", Inter, ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #anbo-startup-card::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: -24px;
        width: 1px;
        background: linear-gradient(transparent, var(--startup-line) 18%, var(--startup-line) 82%, transparent);
        opacity: 0.55;
        pointer-events: none;
        transform-origin: center top;
        animation: anbo-startup-guide-enter 560ms cubic-bezier(0.16, 1, 0.3, 1) 40ms backwards;
      }
      #anbo-startup-card {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-self: center;
        align-self: center;
        width: 100%;
        max-width: 480px;
        height: min(320px, 100%);
        min-height: 0;
      }
      #anbo-startup-brand {
        display: flex;
        align-items: center;
        flex: none;
        gap: 10px;
      }
      #anbo-startup-logo {
        display: block;
        width: 22px;
        height: 22px;
        animation: anbo-startup-logo-enter 300ms cubic-bezier(0.16, 1, 0.3, 1) backwards;
      }
      #anbo-startup-category {
        margin: 0;
        color: var(--startup-muted);
        font-size: 8px;
        line-height: 1.6;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      #anbo-startup-hero {
        display: flex;
        flex: 1;
        flex-direction: column;
        justify-content: center;
        padding: 24px 0 32px;
      }
      #anbo-startup-title {
        margin: 0 0 0 -0.035em;
        font-size: clamp(56px, 12vw, 112px);
        font-weight: 530;
        line-height: 1.1;
        letter-spacing: -0.075em;
        white-space: nowrap;
        animation: anbo-startup-reveal 420ms cubic-bezier(0.16, 1, 0.3, 1) backwards;
      }
      #anbo-startup-cursor {
        display: inline-block;
        width: 0.46em;
        height: 0.09em;
        margin-left: 0.12em;
        background: var(--startup-accent);
        transform-origin: left center;
        animation:
          anbo-startup-cursor-enter 380ms cubic-bezier(0.16, 1, 0.3, 1) 120ms backwards,
          anbo-startup-cursor-pulse 2.6s ease-in-out 650ms infinite;
      }
      #anbo-startup-tagline {
        margin: 16px 0 0;
        color: var(--startup-muted);
        font-size: 13px;
        line-height: 1.5;
        letter-spacing: 0.01em;
        animation: anbo-startup-reveal 360ms cubic-bezier(0.16, 1, 0.3, 1) 80ms backwards;
      }
      #anbo-startup-loading {
        display: flex;
        flex: none;
        flex-direction: column;
        gap: 11px;
        width: 100%;
      }
      #anbo-startup-track {
        width: 100%;
        height: 2px;
        overflow: hidden;
        border-radius: 2px;
        background: var(--startup-line);
      }
      #anbo-startup-progress {
        width: 34%;
        height: 100%;
        border-radius: inherit;
        background: var(--startup-accent);
        animation: anbo-startup-slide 2.4s cubic-bezier(0.65, 0, 0.35, 1) -0.8s infinite;
      }
      #anbo-startup-status-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 6px 20px;
      }
      #anbo-startup-status {
        margin: 0;
        color: var(--startup-muted);
        font-size: 11px;
        line-height: 1.6;
        overflow-wrap: anywhere;
      }
      #anbo-startup-build {
        color: var(--startup-muted);
        font-size: 9px;
        line-height: 1.6;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      #anbo-startup-error {
        display: none;
        box-sizing: border-box;
        width: 100%;
        max-height: 112px;
        overflow: auto;
        scrollbar-width: thin;
        scrollbar-color: var(--startup-muted) transparent;
        margin: 0;
        padding: 12px;
        border: 1px solid color-mix(in srgb, var(--startup-danger) 25%, transparent);
        border-radius: 6px;
        background: color-mix(in srgb, var(--startup-danger) 6%, transparent);
        color: var(--startup-danger);
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 11px;
        line-height: 1.6;
        text-align: left;
        overflow-wrap: anywhere;
      }
      #anbo-startup[data-error="true"] #anbo-startup-error { display: block; }
      #anbo-startup[data-error="true"] #anbo-startup-track { display: none; }
      #anbo-startup[data-error="true"] #anbo-startup-progress { animation: none; }
      #anbo-startup[data-error="true"] #anbo-startup-status { color: var(--startup-fg); }
      #anbo-startup[data-error="true"] #anbo-startup-title { font-size: clamp(48px, 9vw, 80px); }
      #anbo-startup[data-error="true"] #anbo-startup-hero { padding: 16px 0; }
      #anbo-startup[data-error="true"] #anbo-startup-tagline { display: none; }
      #anbo-startup[data-error="true"] #anbo-startup-card::before,
      #anbo-startup[data-error="true"] #anbo-startup-logo,
      #anbo-startup[data-error="true"] #anbo-startup-title,
      #anbo-startup[data-error="true"] #anbo-startup-cursor,
      #anbo-startup[data-error="true"] #anbo-startup-tagline { animation: none; }
      @keyframes anbo-startup-guide-enter {
        from { transform: scaleY(0); }
        to { transform: scaleY(1); }
      }
      @keyframes anbo-startup-logo-enter {
        from { opacity: 0.35; transform: scale(0.96); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes anbo-startup-reveal {
        from { opacity: 0.32; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes anbo-startup-cursor-enter {
        from { opacity: 0.4; transform: scaleX(0.2); }
        to { opacity: 1; transform: scaleX(1); }
      }
      @keyframes anbo-startup-cursor-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      @keyframes anbo-startup-slide {
        from { transform: translateX(-110%); }
        to { transform: translateX(400%); }
      }
      @media (max-width: 600px) {
        #anbo-startup { --startup-gutter: 36px; }
        #anbo-startup-card::before { left: -18px; }
        #anbo-startup-category { font-size: 7px; letter-spacing: 0.12em; }
        #anbo-startup-tagline { font-size: 12px; }
      }
      @media (max-height: 520px) {
        #anbo-startup { padding-top: 44px; padding-bottom: 66px; }
        #anbo-startup-title { font-size: clamp(52px, 11vw, 88px); }
        #anbo-startup-hero { padding: 18px 0 24px; }
        #anbo-startup-tagline { margin-top: 14px; font-size: 12px; }
        #anbo-startup-error { max-height: 80px; }
        #anbo-startup[data-error="true"] #anbo-startup-title { font-size: clamp(44px, 9vw, 72px); }
        #anbo-startup[data-error="true"] #anbo-startup-hero { padding: 12px 0; }
      }
      @media (max-height: 380px) {
        #anbo-startup { padding-top: 40px; padding-bottom: 54px; }
        #anbo-startup-logo { width: 20px; height: 20px; }
        #anbo-startup-title { font-size: clamp(44px, 10vw, 64px); }
        #anbo-startup-hero { padding: 12px 0 18px; }
        #anbo-startup-tagline { display: none; }
        #anbo-startup-loading { gap: 10px; }
        #anbo-startup[data-error="true"] #anbo-startup-hero { display: none; }
        #anbo-startup[data-error="true"] #anbo-startup-loading { margin-top: auto; }
        #anbo-startup-error { max-height: 64px; }
      }
      @media (prefers-reduced-motion: reduce) {
        #anbo-startup-card::before,
        #anbo-startup-logo,
        #anbo-startup-title,
        #anbo-startup-cursor,
        #anbo-startup-tagline { animation: none; }
        #anbo-startup-progress { animation: none; transform: translateX(97%); }
      }
      /* Window controls for the pre-React "Preparing your workspace" surface.
         Mirrors src/components/WindowControls.tsx + the Hugeicons it renders
         (MinusSign / Square / Cancel, viewBox 0 0 24 24, strokeWidth 2) and the
         theme tokens from globals.css, so the startup buttons are pixel-identical
         to the Header's. Lives inside #root → React unmounts it on first render.
         oklch values are duplicated here because globals.css isn't loaded yet. */
      #anbo-startup-controls {
        position: fixed;
        top: 0;
        right: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 6px 4px 0 0;
        -webkit-user-select: none;
        user-select: none;
      }
      #anbo-startup-controls button {
        display: grid;
        place-items: center;
        width: 28px;        /* size-7 */
        height: 28px;
        padding: 0;
        border: 0;
        border-radius: 8px; /* rounded-md = radius * 0.8 */
        background: transparent;
        color: var(--startup-muted);
        cursor: pointer;
        transition: background-color 0.15s ease, color 0.15s ease;
      }
      #anbo-startup-controls button:hover {
        background: var(--startup-hover);
        color: var(--startup-fg);
      }
      #anbo-startup-controls button:focus-visible {
        outline: 2px solid var(--startup-accent);
        outline-offset: 2px;
      }
      #anbo-startup-controls button[data-anbo-wc="close"]:hover {
        background: color-mix(in srgb, var(--startup-danger) 15%, transparent);
        color: var(--startup-danger);
      }
      #anbo-startup-controls svg {
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="anbo-startup" role="status" aria-label="Starting Anbo" data-tauri-drag-region>
        <div id="anbo-startup-card">
          <div id="anbo-startup-brand">
            <img id="anbo-startup-logo" src="/logo.svg" width="22" height="22" alt="" draggable="false" />
            <p id="anbo-startup-category">AI-native terminal</p>
          </div>
          <div id="anbo-startup-hero">
            <h1 id="anbo-startup-title">Anbo<span id="anbo-startup-cursor" aria-hidden="true"></span></h1>
            <p id="anbo-startup-tagline">Your agentic workspace.</p>
          </div>
          <div id="anbo-startup-loading">
            <div id="anbo-startup-track" aria-hidden="true">
              <div id="anbo-startup-progress"></div>
            </div>
            <div id="anbo-startup-status-row">
              <p id="anbo-startup-status">Preparing your workspace</p>
              <span id="anbo-startup-build">%ANBO_VERSION%</span>
            </div>
            <p id="anbo-startup-error" aria-live="polite"></p>
          </div>
        </div>
      </div>
      <div id="anbo-startup-controls" role="group" aria-label="Window controls">
        <button type="button" data-anbo-wc="minimize" aria-label="Minimize" title="Minimize">
          <svg viewBox="0 0 24 24" width="12" height="12"><path d="M20 12L4 12"/></svg>
        </button>
        <button type="button" data-anbo-wc="toggle_maximize" aria-label="Maximize" title="Maximize">
          <svg viewBox="0 0 24 24" width="12" height="12"><path d="M2.5 12C2.5 7.52166 2.5 5.28249 3.89124 3.89124C5.28249 2.5 7.52166 2.5 12 2.5C16.4783 2.5 18.7175 2.5 20.1088 3.89124C21.5 5.28249 21.5 7.52166 21.5 12C21.5 16.4783 21.5 18.7175 20.1088 20.1088C18.7175 21.5 16.4783 21.5 12 21.5C7.52166 21.5 5.28249 21.5 3.89124 20.1088C2.5 18.7175 2.5 16.4783 2.5 12Z"/></svg>
        </button>
        <button type="button" data-anbo-wc="close" aria-label="Close" title="Close">
          <svg viewBox="0 0 24 24" width="14" height="14"><path d="M18 6L6.00081 17.9992M17.9992 18L6 6.00085"/></svg>
        </button>
      </div>
    </div>
    <script>
      // A module evaluation error happens before React can replace this startup
      // surface. Keep the failure visible instead of spinning forever.
      (function () {
        var settled = false;
        var watchdog = 0;
        var moduleTimeoutMs = 60000;
        var stalledPhaseTimeoutMs = 30000;
        function messageOf(value) {
          var text = "";
          try {
            text = value && value.message ? value.message : String(value || "Unknown startup error");
          } catch (e) {
            text = "Unknown startup error";
          }
          return text.length > 500 ? text.slice(0, 497) + "..." : text;
        }
        function showStartupError(value) {
          var startup = document.getElementById("anbo-startup");
          if (!startup) return;
          settled = true;
          window.clearTimeout(watchdog);
          startup.dataset.error = "true";
          startup.setAttribute("role", "alert");
          var status = document.getElementById("anbo-startup-status");
          var detail = document.getElementById("anbo-startup-error");
          if (status) status.textContent = "Anbo could not start";
          if (detail) detail.textContent = messageOf(value);
        }
        function armWatchdog(message, timeoutMs) {
          window.clearTimeout(watchdog);
          watchdog = window.setTimeout(function () {
            if (!settled && document.getElementById("anbo-startup")) {
              showStartupError(message);
            }
          }, timeoutMs);
        }
        window.addEventListener("error", function (event) {
          showStartupError(event.error || event.message);
        });
        window.addEventListener("unhandledrejection", function (event) {
          showStartupError(event.reason);
        });
        window.addEventListener("anbo:startup-error", function (event) {
          showStartupError(event.detail);
        });
        window.addEventListener("anbo:startup-progress", function (event) {
          var phase = messageOf(event.detail);
          var status = document.getElementById("anbo-startup-status");
          if (status) status.textContent = phase;
          armWatchdog(
            "Startup stopped while " + phase + ". Check the application log.",
            stalledPhaseTimeoutMs
          );
        });
        window.addEventListener("anbo:startup-ready", function () {
          settled = true;
          window.clearTimeout(watchdog);
        });
        armWatchdog(
          "The application module did not finish loading. Check the application log.",
          moduleTimeoutMs
        );
      })();

      // Window controls for the pre-React "Preparing your workspace" surface.
      // The @tauri-apps/api bundle isn't loaded yet, so we call the window
      // plugin directly via the core internals Tauri injects at webview boot.
      (function () {
        var controls = document.getElementById("anbo-startup-controls");
        if (!controls) return;
        function label() {
          var meta = window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.metadata;
          return meta && meta.currentWindow && meta.currentWindow.label;
        }
        controls.addEventListener("click", function (e) {
          var btn = e.target.closest && e.target.closest("[data-anbo-wc]");
          if (!btn) return;
          var internals = window.__TAURI_INTERNALS__;
          var l = label();
          if (!internals || typeof internals.invoke !== "function" || !l) return;
          try {
            internals.invoke("plugin:window|" + btn.getAttribute("data-anbo-wc"), { label: l });
          } catch (err) {
            /* Tauri internals not ready yet — ignore */
          }
        });

        // Mirror the Header: restore icon (Copy01) when maximized, else maximize
        // icon (Square). Re-check on viewport resize (maximize/restore fires it).
        // Self-cleans once React unmounts the startup surface.
        var SQUARE = '<svg viewBox="0 0 24 24" width="12" height="12"><path d="M2.5 12C2.5 7.52166 2.5 5.28249 3.89124 3.89124C5.28249 2.5 7.52166 2.5 12 2.5C16.4783 2.5 18.7175 2.5 20.1088 3.89124C21.5 5.28249 21.5 7.52166 21.5 12C21.5 16.4783 21.5 18.7175 20.1088 20.1088C18.7175 21.5 16.4783 21.5 12 21.5C7.52166 21.5 5.28249 21.5 3.89124 20.1088C2.5 18.7175 2.5 16.4783 2.5 12Z"/></svg>';
        var RESTORE = '<svg viewBox="0 0 24 24" width="12" height="12"><path d="M9 15C9 12.1716 9 10.7574 9.87868 9.87868C10.7574 9 12.1716 9 15 9L16 9C18.8284 9 20.2426 9 21.1213 9.87868C22 10.7574 22 12.1716 22 15V16C22 18.8284 22 20.2426 21.1213 21.1213C20.2426 22 18.8284 22 16 22H15C12.1716 22 10.7574 22 9.87868 21.1213C9 20.2426 9 18.8284 9 16L9 15Z"/><path d="M16.9999 9C16.9975 6.04291 16.9528 4.51121 16.092 3.46243C15.9258 3.25989 15.7401 3.07418 15.5376 2.90796C14.4312 2 12.7875 2 9.5 2C6.21252 2 4.56878 2 3.46243 2.90796C3.25989 3.07417 3.07418 3.25989 2.90796 3.46243C2 4.56878 2 6.21252 2 9.5C2 12.7875 2 14.4312 2.90796 15.5376C3.07417 15.7401 3.25989 15.9258 3.46243 16.092C4.51121 16.9528 6.04291 16.9975 9 16.9999"/></svg>';
        var maxBtn = controls.querySelector('[data-anbo-wc="toggle_maximize"]');
        function syncMaximize() {
          if (!document.getElementById("anbo-startup-controls")) {
            window.removeEventListener("resize", syncMaximize);
            return;
          }
          var internals = window.__TAURI_INTERNALS__;
          var l = label();
          if (!internals || typeof internals.invoke !== "function" || !l || !maxBtn) return;
          try {
            Promise.resolve(internals.invoke("plugin:window|is_maximized", { label: l }))
              .then(function (isMax) {
                if (!maxBtn || !document.getElementById("anbo-startup-controls")) return;
                maxBtn.innerHTML = isMax ? RESTORE : SQUARE;
                maxBtn.setAttribute("aria-label", isMax ? "Restore" : "Maximize");
                maxBtn.setAttribute("title", isMax ? "Restore" : "Maximize");
              })
              .catch(function () { /* ignore */ });
          } catch (err) { /* ignore */ }
        }
        syncMaximize();
        window.addEventListener("resize", syncMaximize);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

version: 2

multi-ecosystem-groups:
  # The tauri CLI refuses npm packages and crates on different major.minor
  # versions, so both sides of a tauri update come in one pull request.
  tauri:
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

updates:
  - package-ecosystem: npm
    directory: "/"
    patterns: ["@tauri-apps/*"]
    multi-ecosystem-group: tauri
    cooldown:
      default-days: 3

  - package-ecosystem: cargo
    directory: "/src-tauri"
    patterns: ["tauri", "tauri-build", "tauri-plugin-*"]
    multi-ecosystem-group: tauri
    cooldown:
      default-days: 3

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    ignore:
      # React Compiler 1.0 needs Babel 7: on Babel 8 it compiles fewer
      # components (413 -> 363 memo sentinels in the production build).
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
      # dockview 8 builds tab groups, menus and keyboard docking into its
      # core, which puts the main window 47 KiB gzip over its startup
      # budget for features this app turns off or does not use.
      - dependency-name: "dockview"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dockview-react"
        update-types: ["version-update:semver-major"]
    groups:
      npm-dev:
        dependency-type: development
        update-types:
          - minor
          - patch
      npm-prod-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-major:
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    ignore:
      # These must match the versions wry builds against, so they move by
      # hand with a tauri update.
      - dependency-name: "webview2-com"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "windows"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
    groups:
      cargo:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      cargo-major:
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

name: SignPath Test Sign

on:
  workflow_dispatch:

concurrency:
  group: signpath-test
  cancel-in-progress: false

jobs:
  test-sign-windows:
    if: github.repository == 'mramdann/anbo-ai' && vars.SIGNPATH_TEST_ENABLED == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate SignPath credentials
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          $headers = @{ Authorization = "Bearer $env:SIGNPATH_API_TOKEN" }
          $uri = "https://app.signpath.io/Api/v1/$env:SIGNPATH_ORGANIZATION_ID/Projects"
          $response = Invoke-WebRequest -UseBasicParsing -Headers $headers -Uri $uri
          if ($response.StatusCode -ne 200) {
            throw "SignPath credential validation returned HTTP $($response.StatusCode)"
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: ./src-tauri -> target
          key: windows-signpath-test

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri (no release upload)
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --bundles nsis

      - name: Stage Windows artifacts
        shell: pwsh
        run: |
          $bundleDir = "src-tauri/target/release/bundle"
          $stagingDir = "signpath-staging"
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null
          $exe = Get-ChildItem -Path "$bundleDir/nsis" -Filter "*.exe" -ErrorAction Stop | Select-Object -First 1
          if (-not $exe) { throw "No .exe installer produced by Tauri" }
          Copy-Item $exe.FullName -Destination "$stagingDir/anbo-setup.exe"
          Write-Host "Staged files:"
          Get-ChildItem $stagingDir

      - name: Upload unsigned artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-unsigned
          path: signpath-staging/
          if-no-files-found: error

      - name: Submit signing request to SignPath
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: "test-signing"
          artifact-configuration-slug: "initial"
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: "signed"

      - name: Verify signatures exist
        shell: pwsh
        run: |
          Write-Host "Contents of signed/:"
          Get-ChildItem "signed" -Recurse
          $files = Get-ChildItem "signed" -Include *.exe -Recurse
          if ($files.Count -eq 0) { throw "No signed files found" }
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            if ($null -eq $sig.SignerCertificate) {
              throw "$($f.Name) is NOT signed"
            }
            Write-Host "OK: $($f.Name)"
            Write-Host "    Signer: $($sig.SignerCertificate.Subject)"
            Write-Host "    Status: $($sig.Status)"
          }

      - name: Upload signed artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-signed
          path: signed/

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check release versions
        run: pnpm check-version

      - name: Check native dependency patches
        run: pnpm check:native-patches

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level moderate

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm check-types

      - name: Test
        run: pnpm test:coverage

      - name: React Compiler healthcheck (advisory)
        run: pnpm exec react-compiler-healthcheck
        continue-on-error: true

      - name: Build frontend
        run: pnpm build
        env:
          TAURI_ENV_PLATFORM: windows

      - name: Execute production bundle
        run: pnpm smoke:production

      - name: Bundle and startup budgets
        run: pnpm size

      - name: Dead code (advisory)
        run: pnpm knip
        continue-on-error: true

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fish \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - uses: taiki-e/install-action@v2.87.2
        with:
          tool: cargo-nextest,cargo-machete

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets --locked

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Unused crates (advisory)
        working-directory: src-tauri
        run: cargo machete
        continue-on-error: true

      - name: cargo nextest
        working-directory: src-tauri
        shell: bash
        run: |
          set -o pipefail
          if cargo nextest run --locked 2>&1 | tee nextest.log; then
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path

          lines = Path("nextest.log").read_text(errors="replace").splitlines()
          summary = "\n".join(lines[-80:])
          summary = summary.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Rust nextest failure::{summary}")
          PY
          exit 1

      - name: fish shell integration
        run: fish --no-config src-tauri/src/modules/pty/scripts/init.test.fish

  rust-platforms:
    name: rust-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - uses: taiki-e/install-action@v2.87.2
        with:
          tool: cargo-nextest

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets --locked

      - name: cargo nextest (Windows)
        if: runner.os == 'Windows'
        working-directory: src-tauri
        run: cargo nextest run --locked --retries 2

      - name: cargo nextest (Unix)
        if: runner.os != 'Windows'
        working-directory: src-tauri
        shell: bash
        run: |
          set -o pipefail
          if cargo nextest run --locked --retries 2 2>&1 | tee nextest.log; then
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path

          lines = Path("nextest.log").read_text(errors="replace").splitlines()
          summary = "\n".join(lines[-80:])
          summary = summary.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Rust nextest failure::{summary}")
          PY
          exit 1

  coverage:
    runs-on: ubuntu-22.04
    needs: rust
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: coverage

      - uses: taiki-e/install-action@v2.87.2
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Generate coverage
        working-directory: src-tauri
        run: cargo llvm-cov nextest --locked --fail-under-lines 25 --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: lcov-report
          path: src-tauri/lcov.info
          if-no-files-found: error

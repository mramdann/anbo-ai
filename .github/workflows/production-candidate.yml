name: Production Candidate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-candidate-${{ github.event.pull_request.number || inputs.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.head_ref, 'release-please--branches--main') &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-latest
    env:
      CANDIDATE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_REF }}

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: ./src-tauri -> target
          key: windows-production-candidate

      - name: Install dependencies and validate source
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level moderate
          pnpm check-version

      - name: Build production installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis

      - name: Smoke packaged application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $marker = Join-Path $env:RUNNER_TEMP "anbo-candidate-smoke.txt"
          Remove-Item -LiteralPath $marker -ErrorAction SilentlyContinue
          $env:ANBO_PACKAGED_SMOKE_MARKER = $marker
          $process = Start-Process `
            -FilePath "src-tauri/target/release/anbo.exe" `
            -PassThru `
            -WindowStyle Hidden
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(45)
            while ([DateTime]::UtcNow -lt $deadline) {
              if (Test-Path -LiteralPath $marker) { break }
              if ($process.HasExited) {
                throw "Packaged Anbo exited before frontend startup completed (exit $($process.ExitCode))"
              }
              Start-Sleep -Milliseconds 250
              $process.Refresh()
            }
            if (-not (Test-Path -LiteralPath $marker)) {
              throw "Packaged Anbo did not reach frontend-ready within 45 seconds"
            }
            if ((Get-Content -LiteralPath $marker -Raw).Trim() -ne "frontend-ready") {
              throw "Packaged Anbo produced an invalid startup marker"
            }
          } finally {
            $process.Refresh()
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Prepare candidate metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem `
            -Path "src-tauri/target/release/bundle/nsis" `
            -Filter "*_x64-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          New-Item -ItemType Directory -Path candidate -Force | Out-Null
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$($installer.Name)" | Set-Content -LiteralPath candidate/SHA256SUMS.txt
          @{
            commit = "${{ env.CANDIDATE_REF }}"
            version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          } | ConvertTo-Json | Set-Content -LiteralPath candidate/metadata.json

      - name: Upload production candidate
        uses: actions/upload-artifact@v7
        with:
          name: anbo-production-candidate-${{ github.run_number }}
          path: |
            src-tauri/target/release/bundle/nsis/*_x64-setup.exe
            candidate/SHA256SUMS.txt
            candidate/metadata.json
          if-no-files-found: error
          retention-days: 7

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing tag to build
        required: true
        type: string
  workflow_call:
    inputs:
      release_body:
        description: Generated release notes
        required: false
        type: string
      tag_name:
        description: Existing tag to build
        required: true
        type: string

jobs:
  publish-tauri:
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis"
            rust-target: ""

    runs-on: ${{ matrix.platform }}
    env:
      RELEASE_BODY: ${{ inputs.release_body }}
      RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
      SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ENABLED || 'false' }}
      APPLE_SIGNING_ENABLED: ${{ vars.APPLE_SIGNING_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Resolve release notes
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:RELEASE_BODY)) { exit 0 }
          $version = $env:RELEASE_TAG.TrimStart('v')
          $content = Get-Content CHANGELOG.md -Raw
          $escaped = [regex]::Escape($version)
          $match = [regex]::Match($content, "(?ms)^## \[$escaped\].*?\r?\n(.*?)(?=^## \[|\z)")
          if (-not $match.Success) { throw "No CHANGELOG entry found for $version" }
          Add-Content $env:GITHUB_ENV 'RELEASE_BODY<<ANBO_RELEASE_NOTES'
          Add-Content $env:GITHUB_ENV $match.Groups[1].Value.Trim()
          Add-Content $env:GITHUB_ENV 'ANBO_RELEASE_NOTES'

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.platform }}-${{ matrix.rust-target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release versions
        run: pnpm check-version

      - name: Write Apple API key to disk
        if: startsWith(matrix.platform, 'macos') && env.APPLE_SIGNING_ENABLED == 'true'
        shell: bash
        env:
          KEY_CONTENT: ${{ secrets.APPLE_API_KEY_PATH }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$KEY_CONTENT" > "$HOME/private_keys/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      - id: tauri-signed
        if: startsWith(matrix.platform, 'macos') && env.APPLE_SIGNING_ENABLED == 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "anboai ${{ env.RELEASE_TAG }}"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Defining APPLE_CERTIFICATE with an empty value still makes Tauri try to
      # import it, so unsigned builds must use a separate step with no Apple env.
      - id: tauri
        if: ${{ !startsWith(matrix.platform, 'macos') || env.APPLE_SIGNING_ENABLED != 'true' }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "anboai ${{ env.RELEASE_TAG }}"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Strip the bundled libwayland-* libs from the AppImage so it loads the
      # host copies at runtime. The Ubuntu 22.04 build host ships libwayland
      # 1.20, but recent Mesa (Fedora 43 / Arch / Bazzite, Mesa 1.22+) needs
      # newer symbols; AppImage puts its bundled libs first on the search path,
      # so the stale copy wins and EGL fails with EGL_BAD_PARAMETER. libgdk-3
      # hard-links these three, so removing them only redirects resolution to
      # the host copy, which every GTK-capable system has. They are on the
      # AppImage excludelist for this exact reason. The re-signed AppImage and
      # its .sig are re-uploaded here; the updater manifest is patched in the
      # patch-appimage-updater job after all matrix legs finish, so a parallel
      # macOS/Windows upload cannot clobber the combined latest.json.
      - name: Fix AppImage wayland libs and re-sign
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          APPIMAGE=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)
          BASENAME=$(basename "$APPIMAGE")
          echo "Patching: $APPIMAGE"

          WORK=$(mktemp -d)
          cp "$APPIMAGE" "$WORK/"
          pushd "$WORK" >/dev/null
          chmod +x "./$BASENAME"
          "./$BASENAME" --appimage-extract >/dev/null

          # Fail loud if Tauri/linuxdeploy stops bundling these, so a future
          # layout change cannot silently ship an unfixed AppImage.
          for lib in libwayland-client.so.0 libwayland-egl.so.1 libwayland-cursor.so.0; do
            test -e "squashfs-root/usr/lib/$lib" \
              || { echo "expected bundled lib missing: $lib (layout changed?)"; exit 1; }
          done

          rm -f squashfs-root/usr/lib/libwayland-client.so.0 \
                squashfs-root/usr/lib/libwayland-egl.so.1 \
                squashfs-root/usr/lib/libwayland-cursor.so.0 \
                squashfs-root/usr/lib/libwayland-server.so.0

          curl -fsSL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run squashfs-root "$BASENAME"

          # Sanity-check the repacked image before it replaces the original.
          rm -rf squashfs-root
          chmod +x "./$BASENAME"
          "./$BASENAME" --appimage-extract >/dev/null
          for lib in libwayland-client.so.0 libwayland-egl.so.1 libwayland-cursor.so.0; do
            test ! -e "squashfs-root/usr/lib/$lib" \
              || { echo "lib still present after repack: $lib"; exit 1; }
          done
          test -x squashfs-root/usr/bin/anboai \
            || { echo "anboai binary missing from repacked AppImage"; exit 1; }
          popd >/dev/null

          cp "$WORK/$BASENAME" "$APPIMAGE"

          rm -f "$APPIMAGE.sig"
          pnpm tauri signer sign "$APPIMAGE"

          TAG="${RELEASE_TAG}"
          gh release upload "$TAG" "$APPIMAGE" "$APPIMAGE.sig" \
            --clobber --repo "$GITHUB_REPOSITORY"

      # SignPath Authenticode-signs the Windows installer. Its bytes change,
      # so the minisign updater signatures tauri-action produced over the
      # unsigned file no longer match. We stage the installer under the exact
      # name the SignPath artifact configuration expects, submit it, then
      # re-run the Tauri signer over the signed file and re-upload it with its
      # temporary .sig. latest.json is patched in the final
      # patch-updater-manifest job, after every matrix leg has merged, so a
      # parallel macOS/Linux upload cannot clobber the Windows signatures.
      - name: Stage Windows installers for SignPath
        if: matrix.platform == 'windows-latest' && env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundleDir = "src-tauri/target/release/bundle"
          $exe = Get-ChildItem "$bundleDir/nsis" -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "No NSIS .exe produced by Tauri" }
          New-Item -ItemType Directory -Path signpath-staging -Force | Out-Null
          Copy-Item $exe.FullName signpath-staging/anboai-setup.exe
          "EXE_REAL_PATH=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Append

      - name: Upload unsigned Windows artifact
        id: upload-windows
        if: matrix.platform == 'windows-latest' && env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned
          path: signpath-staging/
          if-no-files-found: error

      # Requires manual approval in the SignPath UI for the production policy.
      # The default wait timeout is 600s; bumped so the job survives the time
      # it takes to review and approve the request during a release.
      - name: Submit Windows installers to SignPath
        if: matrix.platform == 'windows-latest' && env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'initial'
          github-artifact-id: ${{ steps.upload-windows.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: 'signed'

      - name: Re-sign updater and upload signed Windows installers
        if: matrix.platform == 'windows-latest' && env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $signedExe = "signed/anboai-setup.exe"
          if (-not (Test-Path $signedExe)) { throw "Signed artifact missing: $signedExe" }
          $sig = Get-AuthenticodeSignature $signedExe
          if ($null -eq $sig.SignerCertificate) { throw "$signedExe is NOT Authenticode-signed" }
          if ($sig.Status -ne 'Valid') { throw "$signedExe signature status: $($sig.Status)" }
          Copy-Item $signedExe $env:EXE_REAL_PATH -Force
          Remove-Item "$($env:EXE_REAL_PATH).sig" -ErrorAction SilentlyContinue
          pnpm tauri signer sign $env:EXE_REAL_PATH
          gh release upload $env:RELEASE_TAG `
            $env:EXE_REAL_PATH "$($env:EXE_REAL_PATH).sig" `
            --clobber --repo $env:GITHUB_REPOSITORY

      - name: Remove standalone updater signatures
        if: matrix.platform == 'windows-latest' && env.SIGNPATH_ENABLED != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY `
            --json assets --jq '.assets[].name'
          foreach ($asset in $assets) {
            if ($asset.EndsWith('.sig') -or $asset.EndsWith('.msi')) {
              gh release delete-asset $env:RELEASE_TAG $asset `
                --yes --repo $env:GITHUB_REPOSITORY
            }
          }

  # SignPath changes the installer bytes after tauri-action creates latest.json.
  # Patch the manifest only when SignPath is enabled; unsigned Windows releases
  # already contain the correct signatures and URLs.
  patch-updater-manifest:
    needs: publish-tauri
    if: vars.SIGNPATH_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
    permissions:
      contents: write
    steps:
      - name: Patch latest.json with signed Windows signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "latest.json" \
            --pattern "*_x64-setup.exe.sig" --clobber

          EXE_SIG=$(cat ./*_x64-setup.exe.sig)

          # Re-signing an artifact re-uploads it with --clobber, which deletes
          # and recreates the asset under a new id. tauri-action baked the old
          # asset-id API urls into latest.json, so we also rewrite the urls of
          # the re-signed artifacts to the tag+filename download url, which is
          # stable across clobbers. Filenames come from the .sig names.
          EXE_FILE=$(basename "$(ls ./*_x64-setup.exe.sig)" .sig)
          DL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          jq -e 'has("platforms") and (.platforms | has("windows-x86_64")
            and has("windows-x86_64-nsis"))' latest.json >/dev/null \
            || { echo "latest.json missing an expected platform key"; exit 1; }

          jq --arg sig "$EXE_SIG" --arg url "$DL/$EXE_FILE" '
            .platforms["windows-x86_64"] += {signature: $sig, url: $url}
            | .platforms["windows-x86_64-nsis"] += {signature: $sig, url: $url}
            | del(.platforms["windows-x86_64-msi"])
          ' latest.json > latest.json.tmp
          mv latest.json.tmp latest.json

          gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"
          while IFS= read -r asset; do
            gh release delete-asset "$TAG" "$asset" \
              --yes --repo "$GITHUB_REPOSITORY"
          done < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name | select(endswith(".sig") or endswith(".msi"))')

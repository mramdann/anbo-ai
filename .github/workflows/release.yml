name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing draft release tag to build
        required: true
        type: string
      expected_sha:
        description: Expected tag commit SHA
        required: true
        type: string
  workflow_call:
    inputs:
      tag_name:
        description: Existing draft release tag to build
        required: true
        type: string
      expected_sha:
        description: Expected tag commit SHA
        required: true
        type: string

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      release_sha: ${{ steps.verify.outputs.release_sha }}
    env:
      RELEASE_TAG: ${{ inputs.tag_name }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ENABLED || 'false' }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag_name }}
          fetch-depth: 0

      - id: verify
        name: Verify exact tag, CI, draft, and updater signing configuration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG"
          test -n "$EXPECTED_SHA"
          test -n "$TAURI_SIGNING_PRIVATE_KEY" \
            || { echo "TAURI_SIGNING_PRIVATE_KEY is missing"; exit 1; }
          test -n "$SIGNPATH_API_TOKEN" \
            || { echo "SIGNPATH_API_TOKEN is missing"; exit 1; }
          test "$SIGNPATH_ENABLED" = "true" \
            || { echo "SIGNPATH_ENABLED must be true for a production release"; exit 1; }
          test -n "$SIGNPATH_ORGANIZATION_ID" \
            || { echo "SIGNPATH_ORGANIZATION_ID repository variable is missing"; exit 1; }
          test -n "$SIGNPATH_PROJECT_SLUG" \
            || { echo "SIGNPATH_PROJECT_SLUG repository variable is missing"; exit 1; }

          RELEASE_SHA=$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")
          test "$RELEASE_SHA" = "$EXPECTED_SHA" \
            || { echo "Tag $RELEASE_TAG points to $RELEASE_SHA, expected $EXPECTED_SHA"; exit 1; }
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI \
            --commit "$RELEASE_SHA" --event push --limit 1 \
            --json status,conclusion \
            --jq 'if length == 0 then "missing" else .[0].status + ":" + (.[0].conclusion // "") end')
          test "$conclusion" = "completed:success" \
            || { echo "Exact tag SHA has no successful CI run: $conclusion"; exit 1; }

          is_draft=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .draft" | head -n 1)
          test "$is_draft" = "true" \
            || { echo "Release $RELEASE_TAG must already exist as a draft"; exit 1; }
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: gate
    runs-on: windows-latest
    permissions:
      actions: read
      contents: write
      id-token: write
    outputs:
      installer_sha256: ${{ steps.verify-signed.outputs.installer_sha256 }}
    env:
      RELEASE_TAG: ${{ inputs.tag_name }}
      RELEASE_SHA: ${{ needs.gate.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.release_sha }}

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: ./src-tauri -> target
          key: windows-release

      - name: Install dependencies and validate source
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level moderate
          pnpm check-version

      - name: Build installer and updater artifacts into the existing draft
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseDraft: true
          prerelease: false
          args: --bundles nsis

      - id: locate-installer
        name: Stage Windows installer for SignPath
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem `
            -Path "src-tauri/target/release/bundle/nsis" `
            -Filter "*_x64-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          New-Item -ItemType Directory -Path signpath-staging -Force | Out-Null
          Copy-Item -LiteralPath $installer.FullName -Destination signpath-staging/anbo-setup.exe
          "installer_path=$($installer.FullName)" >> $env:GITHUB_OUTPUT

      - id: upload-unsigned-installer
        name: Upload installer for trusted Authenticode signing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-unsigned-${{ needs.gate.outputs.release_sha }}
          path: signpath-staging/
          if-no-files-found: error
          retention-days: 1

      - name: Sign Windows installer with SignPath
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          artifact-configuration-slug: initial
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installer

      - id: verify-signed
        name: Verify signed installer and refresh updater signature
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          INSTALLER_PATH: ${{ steps.locate-installer.outputs.installer_path }}
        run: |
          $ErrorActionPreference = "Stop"
          $signed = Get-ChildItem -Path signed-installer -Filter anbo-setup.exe -Recurse |
            Select-Object -First 1
          if (-not $signed) { throw "SignPath did not return anbo-setup.exe" }

          $signature = Get-AuthenticodeSignature -LiteralPath $signed.FullName
          if ($signature.Status -ne "Valid" -or -not $signature.SignerCertificate) {
            throw "SignPath artifact has invalid Authenticode status: $($signature.Status)"
          }

          Copy-Item -LiteralPath $signed.FullName -Destination $env:INSTALLER_PATH -Force
          $updaterSignature = "$env:INSTALLER_PATH.sig"
          Remove-Item -LiteralPath $updaterSignature -ErrorAction SilentlyContinue
          pnpm tauri signer sign "$env:INSTALLER_PATH"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $updaterSignature)) {
            throw "Tauri updater signature was not regenerated for the signed installer"
          }

          $hash = (Get-FileHash -LiteralPath $env:INSTALLER_PATH -Algorithm SHA256).Hash.ToLowerInvariant()
          $subject = $signature.SignerCertificate.Subject
          "installer_sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "Validated Authenticode signer: $subject"

          gh release upload $env:RELEASE_TAG `
            $env:INSTALLER_PATH `
            $updaterSignature `
            --clobber `
            --repo $env:GITHUB_REPOSITORY

      - name: Smoke packaged Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $marker = Join-Path $env:RUNNER_TEMP "anbo-packaged-smoke.txt"
          Remove-Item -LiteralPath $marker -ErrorAction SilentlyContinue
          $env:ANBO_PACKAGED_SMOKE_MARKER = $marker
          $process = Start-Process `
            -FilePath "src-tauri/target/release/anbo.exe" `
            -PassThru `
            -WindowStyle Hidden
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(45)
            while ([DateTime]::UtcNow -lt $deadline) {
              if (Test-Path -LiteralPath $marker) { break }
              if ($process.HasExited) {
                throw "Packaged Anbo exited before frontend startup completed (exit $($process.ExitCode))"
              }
              Start-Sleep -Milliseconds 250
              $process.Refresh()
            }
            if (-not (Test-Path -LiteralPath $marker)) {
              throw "Packaged Anbo did not reach frontend-ready within 45 seconds"
            }
            if ((Get-Content -LiteralPath $marker -Raw).Trim() -ne "frontend-ready") {
              throw "Packaged Anbo produced an invalid startup marker"
            }
          } finally {
            $process.Refresh()
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

  patch-updater-manifest:
    needs: [gate, publish-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag_name }}
    steps:
      - name: Patch latest.json with updater signature metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir release-assets
          cd release-assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json --pattern '*_x64-setup.exe.sig'
          SIG_FILE=$(find . -maxdepth 1 -name '*_x64-setup.exe.sig' -print -quit)
          test -n "$SIG_FILE"
          EXE_SIG=$(cat "$SIG_FILE")
          test -n "$EXE_SIG"
          EXE_FILE=$(basename "$SIG_FILE" .sig)
          DOWNLOAD="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"

          jq -e 'has("version") and has("platforms")' latest.json >/dev/null
          jq --arg sig "$EXE_SIG" --arg url "$DOWNLOAD/$EXE_FILE" '
            .platforms["windows-x86_64"] += {signature: $sig, url: $url}
            | .platforms["windows-x86_64-nsis"] += {signature: $sig, url: $url}
            | del(.platforms["windows-x86_64-msi"])
          ' latest.json > latest.json.tmp
          mv latest.json.tmp latest.json
          gh release upload "$RELEASE_TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"
          gh release delete-asset "$RELEASE_TAG" "$(basename "$SIG_FILE")" \
            --yes --repo "$GITHUB_REPOSITORY"

  publish-release:
    needs: [gate, publish-tauri, patch-updater-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      RELEASE_TAG: ${{ inputs.tag_name }}
      RELEASE_SHA: ${{ needs.gate.outputs.release_sha }}
      EXPECTED_INSTALLER_SHA256: ${{ needs.publish-tauri.outputs.installer_sha256 }}
    steps:
      - name: Validate complete draft and publish atomically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)
          test "$remote_sha" = "$RELEASE_SHA"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true

          mkdir final-assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir final-assets
          EXE=$(find final-assets -maxdepth 1 -name '*_x64-setup.exe' -print -quit)
          test -n "$EXE" && test -s "$EXE"
          test -n "$EXPECTED_INSTALLER_SHA256"
          test "$(sha256sum "$EXE" | cut -d ' ' -f 1)" = "$EXPECTED_INSTALLER_SHA256" \
            || { echo "Published installer differs from the verified Authenticode artifact"; exit 1; }
          test -s final-assets/latest.json
          VERSION=${RELEASE_TAG#v}
          jq -e --arg version "$VERSION" '
            .version == $version
            and (.platforms["windows-x86_64"].signature | length > 0)
            and (.platforms["windows-x86_64-nsis"].signature | length > 0)
            and (.platforms["windows-x86_64"].url | endswith("_x64-setup.exe"))
            and (.platforms["windows-x86_64-nsis"].url | endswith("_x64-setup.exe"))
          ' final-assets/latest.json >/dev/null

          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --latest

          release_pr=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and (.title | startswith("chore(main): release ")))][0].number // empty')
          test -n "$release_pr" \
            || { echo "Could not find the merged Release Please PR for $RELEASE_SHA"; exit 1; }
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$release_pr/labels" \
            -f "labels[]=autorelease: tagged" \
            --silent
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/issues/$release_pr/labels/autorelease%3A%20pending" \
            --silent
